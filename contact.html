<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Star Bakery - Contact & Pre-Orders</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact-form-container">
      <h1>Contact & Pre-Orders</h1>
      <form>
        <div style="margin-bottom: 1rem;">
          <label for="fullname">Full Name:*</label><br>
          <input type="text" id="fullname" name="fullname" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label for="email">Email Address:*</label><br>
          <input type="email" id="email" name="email" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label for="date">Requested Pickup Date:*</label><br>
          <input type="date" id="date" name="date" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label for="details">Item Details:*</label><br>
          <textarea id="details" name="details" rows="4" style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;" placeholder="Describe items or quantities..."></textarea>
        </div>

        <button type="submit" class="btn-primary">Submit Request</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 North Star Bakery. All rights reserved.</p>
  </footer>

  <!-- JavaScript Link -->
  <script src="script.js"></script>
</body>
</html>
